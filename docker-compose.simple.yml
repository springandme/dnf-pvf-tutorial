# 简化版 Docker Compose 配置
# 适用于快速部署和测试

version: '3.8'

services:
  dnf-pvf-tutorial:
    # 使用预构建的镜像
    image: ghcr.io/springandme/dnf-pvf-tutorial:latest
    
    container_name: dnf-pvf-tutorial-simple
    
    # 端口映射
    ports:
      - "7210:3000"
    
    # 挂载课程数据目录
    volumes:
      - ./pvfCourse:/app/pvfCourse:ro
      # 教程图片缓存目录（可在宿主机先跑 scripts/mirror-daf-media.js 预热）
      - ./media-cache:/app/media-cache
    
    # 重启策略
    restart: unless-stopped
    
    # 环境变量
    environment:
      - NODE_ENV=production
      # 可选：DAF 源站屏蔽境外时的出站代理（经国内网络反向隧道中转）
      - MEDIA_UPSTREAM_PROXY=${MEDIA_UPSTREAM_PROXY:-}

    # 让容器能访问宿主机上的反向隧道代理端口（host-gateway = 宿主 docker0 IP）
    extra_hosts:
      - "host.docker.internal:host-gateway"
