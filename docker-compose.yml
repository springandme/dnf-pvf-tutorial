version: '3.8'

services:
  dnf-pvf-tutorial:
    # 使用本地构建的镜像
    build:
      context: .
      dockerfile: Dockerfile
      target: production

    # 或者使用预构建的镜像（取消注释下面一行，注释掉上面的 build 部分）
    # image: ghcr.io/springandme/dnf-pvf-tutorial:latest

    container_name: dnf-pvf-tutorial

    # 端口映射：宿主机端口:容器端口
    ports:
      - "7210:3000"

    # 环境变量
    environment:
      - NODE_ENV=production
      - PORT=3000
      # 可选：DAF 源站屏蔽境外时的出站代理（经国内网络反向隧道中转）
      - MEDIA_UPSTREAM_PROXY=${MEDIA_UPSTREAM_PROXY:-}

    # 让容器能访问宿主机上的反向隧道代理端口（host-gateway = 宿主 docker0 IP）
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # 数据卷挂载
    volumes:
      # 挂载课程数据目录，支持热更新
      - ./pvfCourse:/app/pvfCourse:ro
      # 挂载教程图片缓存目录（可在宿主机先跑 scripts/mirror-daf-media.js 预热）
      - ./media-cache:/app/media-cache
      # 可选：挂载日志目录
      - ./logs:/app/logs

    # 重启策略
    restart: unless-stopped

    # 健康检查
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/files"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

    # 网络配置
    networks:
      - dnf-tutorial-network

# 自定义网络
networks:
  dnf-tutorial-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# 数据卷定义（可选，用于持久化数据）
volumes:
  tutorial-logs:
    driver: local